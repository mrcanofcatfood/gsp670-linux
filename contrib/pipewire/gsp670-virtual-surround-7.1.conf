# GSP 670 virtual 7.1 surround sink for PipeWire
#
# Accepts 8-channel (FL FR FC LFE RL RR SL SR) input, convolves every channel
# with the HeSuVi HRIR (Sennheiser GSX preset) and outputs stereo to the
# GSA 70 "Game" device. The headset hardware is stereo-only; all surround
# virtualization happens here, on the host.
#
# Graph adapted from PipeWire's reference
#   /usr/share/pipewire/filter-chain/sink-virtual-surround-7.1-hesuvi.conf
#
# IR file: ~/.local/share/pipewire/hrir_hesuvi/hrir.wav
# Install it with:  scripts/setup-virtual-surround.sh
#
# Two ways to load this file:
#   live (until reboot):   pactl load-module module-filter-chain file=<path>
#   persistent:            copy into ~/.config/pipewire/pipewire.conf.d/
#
# License note: the HeSuVi HRIR presets are distributed with HeSuVi
# (https://sourceforge.net/projects/hesuvi/). See docs/virtual-surround.md.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "GSP 670 Virtual Surround 7.1"
            media.name       = "GSP 670 Virtual Surround 7.1"
            filter.graph = {
                nodes = [
                    # duplicate inputs
                    { type = builtin label = copy name = copyFL  }
                    { type = builtin label = copy name = copyFR  }
                    { type = builtin label = copy name = copyFC  }
                    { type = builtin label = copy name = copyRL  }
                    { type = builtin label = copy name = copyRR  }
                    { type = builtin label = copy name = copySL  }
                    { type = builtin label = copy name = copySR  }
                    { type = builtin label = copy name = copyLFE }

                    # apply hrir - HeSuVi 14-channel WAV. NOTE: the gsx preset
                    # stores surround pairs REAR-first, SIDE-second (verified
                    # by impulse/complex-ratio measurement), i.e. channels are
                    # FL_L FL_R RL_L RL_R SL_L SL_R FC_L FR_R FR_L RR_R RR_L
                    # SR_R SR_L FC_R:
                    { type = builtin label = convolver name = convFL_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  0 } }
                    { type = builtin label = convolver name = convFL_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  1 } }
                    { type = builtin label = convolver name = convRL_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  2 } }
                    { type = builtin label = convolver name = convRL_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  3 } }
                    { type = builtin label = convolver name = convSL_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  4 } }
                    { type = builtin label = convolver name = convSL_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  5 } }
                    { type = builtin label = convolver name = convFC_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  6 } }
                    { type = builtin label = convolver name = convFR_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  7 } }
                    { type = builtin label = convolver name = convFR_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  8 } }
                    { type = builtin label = convolver name = convRR_R config = { filename = "hrir_hesuvi/hrir.wav" channel =  9 } }
                    { type = builtin label = convolver name = convRR_L config = { filename = "hrir_hesuvi/hrir.wav" channel = 10 } }
                    { type = builtin label = convolver name = convSR_R config = { filename = "hrir_hesuvi/hrir.wav" channel = 11 } }
                    { type = builtin label = convolver name = convSR_L config = { filename = "hrir_hesuvi/hrir.wav" channel = 12 } }
                    { type = builtin label = convolver name = convFC_R config = { filename = "hrir_hesuvi/hrir.wav" channel = 13 } }

                    # treat LFE as FC (HeSuVi convention; headphones cannot
                    # reproduce a discrete sub channel)
                    { type = builtin label = convolver name = convLFE_L config = { filename = "hrir_hesuvi/hrir.wav" channel =  6 } }
                    { type = builtin label = convolver name = convLFE_R config = { filename = "hrir_hesuvi/hrir.wav" channel = 13 } }

                    # stereo output
                    { type = builtin label = mixer name = mixL }
                    { type = builtin label = mixer name = mixR }
                ]
                links = [
                    # input
                    { output = "copyFL:Out"  input="convFL_L:In"  }
                    { output = "copyFL:Out"  input="convFL_R:In"  }
                    { output = "copySL:Out"  input="convSL_L:In"  }
                    { output = "copySL:Out"  input="convSL_R:In"  }
                    { output = "copyRL:Out"  input="convRL_L:In"  }
                    { output = "copyRL:Out"  input="convRL_R:In"  }
                    { output = "copyFC:Out"  input="convFC_L:In"  }
                    { output = "copyFR:Out"  input="convFR_R:In"  }
                    { output = "copyFR:Out"  input="convFR_L:In"  }
                    { output = "copySR:Out"  input="convSR_R:In"  }
                    { output = "copySR:Out"  input="convSR_L:In"  }
                    { output = "copyRR:Out"  input="convRR_R:In"  }
                    { output = "copyRR:Out"  input="convRR_L:In"  }
                    { output = "copyFC:Out"  input="convFC_R:In"  }
                    { output = "copyLFE:Out" input="convLFE_L:In" }
                    { output = "copyLFE:Out" input="convLFE_R:In" }

                    # output
                    { output = "convFL_L:Out"  input="mixL:In 1" }
                    { output = "convFL_R:Out"  input="mixR:In 1" }
                    { output = "convSL_L:Out"  input="mixL:In 2" }
                    { output = "convSL_R:Out"  input="mixR:In 2" }
                    { output = "convRL_L:Out"  input="mixL:In 3" }
                    { output = "convRL_R:Out"  input="mixR:In 3" }
                    { output = "convFC_L:Out"  input="mixL:In 4" }
                    { output = "convFC_R:Out"  input="mixR:In 4" }
                    { output = "convFR_R:Out"  input="mixR:In 5" }
                    { output = "convFR_L:Out"  input="mixL:In 5" }
                    { output = "convSR_R:Out"  input="mixR:In 6" }
                    { output = "convSR_L:Out"  input="mixL:In 6" }
                    { output = "convRR_R:Out"  input="mixR:In 7" }
                    { output = "convRR_L:Out"  input="mixL:In 7" }
                    { output = "convLFE_R:Out" input="mixR:In 8" }
                    { output = "convLFE_L:Out" input="mixL:In 8" }
                ]
                # Port order must match the SPA default 8-channel order used
                # by pw-cat/libsndfile files ([... SL SR RL RR]); a mismatched
                # declaration makes clients link channels by index and the
                # side/rear pairs get crossed.
                inputs  = [ "copyFL:In" "copyFR:In" "copyFC:In" "copyLFE:In" "copySL:In" "copySR:In" "copyRL:In" "copyRR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                node.name      = "GSP670_Surround"
                media.class    = Audio/Sink
                audio.channels = 8
                audio.position = [ FL FR FC LFE SL SR RL RR ]
            }
            playback.props = {
                node.name      = "GSP670_Surround.output"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
                # route straight into the GSA 70 Game device, bypassing any
                # default-sink detour (e.g. EasyEffects). Remove this line to
                # follow the system default sink instead.
                node.target    = "alsa_output.usb-Sennheiser_EPOS_GSA_70-00.stereo-game"
            }
        }
    }
]
