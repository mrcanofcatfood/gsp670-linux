name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          # The D-Bus daemon is an optional extra, but its unit tests need the
          # libraries present.
          python -m pip install dbus-python PyGObject || \
            echo "note: dbus tests will be skipped"

      - name: Run the test suite
        run: python -m pytest tests/unit tests/integration -q

      - name: Lint
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check src/ tests/ scripts/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check the shell scripts
        run: |
          shellcheck -x \
            scripts/install.sh \
            scripts/distros.sh \
            scripts/gsp670-audio-guard.sh \
            scripts/gsp670-audio-doctor.sh \
            scripts/setup-virtual-surround.sh
