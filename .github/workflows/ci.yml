name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install the optional D-Bus stack
        # dbus-python needs the system development headers to build. When they
        # are unavailable the D-Bus tests skip themselves rather than failing.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev pkg-config
          python -m pip install dbus-python PyGObject || \
            echo "note: the D-Bus stack is unavailable; its tests will skip"

      - name: Run the test suite
        run: python -m pytest tests/unit tests/integration -q

      - name: Lint
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check src/ tests/ scripts/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check the shell scripts
        run: |
          shellcheck -x \
            scripts/install.sh \
            scripts/distros.sh \
            scripts/gsp670-audio-guard.sh \
            scripts/gsp670-audio-doctor.sh \
            scripts/setup-virtual-surround.sh \
            scripts/check-provenance.sh \
            scripts/hardware-test.sh \
            scripts/run-hw-tests.sh

  provenance:
    # Required check. This repository publishes the hardware interface only;
    # the vendor's implementation detail (binaries, decompiled output,
    # captures, disassembly, internal symbol names, code addresses) must never
    # be committed. See docs/legal.md.
    name: Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check inspects tracked files, so it needs the full history.
          fetch-depth: 0

      - name: Check the publication boundary
        run: ./scripts/check-provenance.sh

      - name: Verify no binary files are tracked
        run: |
          # Belt and braces: confirm with `file` that nothing tracked is
          # actually a binary. Empty marker files are fine.
          failed=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            [ -s "$f" ] || continue
            if ! file --mime "$f" | grep -qE 'text/|application/(json|xml)'; then
              echo "::error file=$f is not a text file ($(file -b "$f"))"
              failed=1
            fi
          done < <(git ls-files)
          exit $failed

