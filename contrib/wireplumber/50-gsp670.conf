# GSP 670 / GSA 70 — keep the USB-audio nodes alive (WirePlumber 0.5+)
#
# Why
# ---
# WirePlumber's suspend-node.lua suspends an idle ALSA node after
# `session.suspend-timeout-seconds` (default: 5). On the GSA 70 / GSP 670 the
# suspend -> resume cycle is unreliable: when a new stream (Discord starting a
# call, a browser tab, joining a voice channel) opens the device, the node is
# rebuilt and any host DSP stage in front of it (EasyEffects, a filter-chain)
# races the rebuild. The audible symptoms are:
#
#   * Discord logs "[AVError] no-audio-input-detected" and its InputWatcher
#     flaps "Silence: true" / "Silence: false";
#   * starting one app's audio makes another app's audio stop;
#   * EasyEffects spams "pw_manager.cpp Remote error res: No such file or
#     directory / unknown resource N op:2".
#
# Setting the timeout to 0 disables idle suspend for these nodes. Because the
# dongle is USB Full-Speed (12 Mbps) with a bridge-buffering quirk, keeping the
# stream hot is cheaper than repeatedly tearing it down and rebuilding it.
#
# Install
# -------
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp contrib/wireplumber/50-gsp670.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber
#
# Verify
# ------
#   pw-cli info <node-id> | grep state      # should stay "running"/"idle", not "suspended"
#   scripts/gsp670-audio-doctor.sh
#
# This file uses WirePlumber 0.5 SPA-JSON syntax. On WirePlumber 0.4 and older
# the Lua drop-in path was ~/.config/wireplumber/main.lua.d/ — that no longer
# works and is NOT supported here.

monitor.alsa.rules = [
  {
    matches = [
      # Wireless: GSA 70 dongle (card "EPOS GSA 70")
      { node.name = "~alsa_(output|input).*GSA_70.*" }
      # Wired: GSP 670 over Micro-USB
      { node.name = "~alsa_(output|input).*GSP_?670.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
